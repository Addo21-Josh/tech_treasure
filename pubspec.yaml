name: tech_treasure
description: "A personal offline-first technology knowledge and content-production database for creators."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # State Management & Dependency Injection
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Declarative Routing
  go_router: ^14.2.0

  # Local SQLite Relational Database & FTS5
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Immutable Models & JSON Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities (UUID, Date, Cryptographic Checksum)
  uuid: ^4.4.0
  intl: ^0.19.0
  crypto: ^3.0.3

  # Sharing & File Access (Backup / Restore / Share Intent)
  share_plus: ^9.0.0
  file_picker: ^8.0.0
  receive_sharing_intent: 1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting & Code Quality
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  # Mocking for Automated Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
